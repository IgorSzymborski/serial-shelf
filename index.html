<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script defer src="app.js"></script>
    <title>Serial-Shelf</title>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <nav class="navbar">
          <p class="navbar__logo">
            Serial Shelf
            <span class="navbar__logo-accent" aria-hidden="true">*</span>
          </p>

          <ul class="navbar__list">
            <li class="navbar__item">
              <button
                class="navbar__button navbar__button--active"
                type="button"
                aria-pressed="true"
              >
                Odkrywaj
              </button>
            </li>
            <li class="navbar__item">
              <button class="navbar__button" type="button" aria-pressed="false">
                Moja lista
                <span class="navbar__count">3</span>
              </button>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="container">
          <p class="hero__eyebrow">Twoja następna historia</p>
          <h1 class="hero__title">
            Dobry serial. <br class="hero__break" />Dobry wieczór
          </h1>
          <p class="hero__description">
            Wyszukuj seriale i zapisuj te, do których chcesz wrócić.
          </p>

          <form action="" class="search-form">
            <label for="serial-query" class="search-form__label"
              >Tytuł serialu</label
            >
            <div class="search-form__field">
              <input
                id="serial-query"
                type="search"
                name="query"
                class="search-form__input"
              />
              <svg
                class="search-form__icon"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <circle cx="10.5" cy="10.5" r="6.5" />
                <path d="m16 16 4.5 4.5" />
              </svg>
            </div>

            <button class="search-form__button" type="submit">Szukaj</button>
            <p class="search-form__source">Tytuły i opisy pochodzą z TVmaze</p>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
